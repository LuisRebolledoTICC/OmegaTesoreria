name: Respaldo Diario de Base de Datos PostgreSQL (Neon)

on:
  schedule:
    # Ejecutar todos los días a las 02:00 UTC (8:00 PM Ciudad de México)
    - cron: '0 2 * * *'
  workflow_dispatch: # Permite ejecutar el respaldo manualmente desde GitHub con 1 clic

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar herramientas cliente de PostgreSQL 16/17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client gzip

      - name: Ejecutar pg_dump y comprimir respaldo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          FECHA=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILE="omega_tesoreria_backup_${FECHA}.sql.gz"
          echo "Generando respaldo: $BACKUP_FILE"
          pg_dump "$DATABASE_URL" | gzip > "$BACKUP_FILE"
          
          # Validar que el archivo de respaldo exista y no esté vacío
          FILESIZE=$(stat -c%s "$BACKUP_FILE")
          echo "Tamaño del respaldo: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 500 ]; then
            echo "Error: El archivo de respaldo parece corrupto o vacío."
            exit 1
          fi
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV
          echo "FECHA=$FECHA" >> $GITHUB_ENV

      - name: Guardar respaldo como artefacto de GitHub (Retención configurable)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Publicar respaldo en GitHub Releases (Almacenamiento permanente seguro)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "backup-${{ env.FECHA }}"
          name: "Respaldo Automático ${{ env.FECHA }}"
          body: "Respaldo diario de seguridad de la base de datos de producción Neon PostgreSQL."
          files: ${{ env.BACKUP_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
